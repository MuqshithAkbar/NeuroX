<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroX Ticket Classifier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>NeuroX Ticket Classifier</h1>
        <p>Enter a support ticket to predict its category and team.</p>

        <form id="ticketForm">
            <label for="channel">Ticket channel</label>
            <select id="channel" required>
                <option value="email">Email</option>
                <option value="chat">Chat</option>
                <option value="call_transcript">Call transcript</option>
            </select>

            <label for="title">Ticket title / email subject</label>
            <input id="title" type="text" placeholder="For example: Refund not received">

            <label for="description">Ticket text</label>
            <textarea id="description" placeholder="Describe the customer's issue" required></textarea>

            <!-- Enter the key only for your local demo. Do not save it in this file. -->
            <label for="apiKey">API key (local demo)</label>
            <input id="apiKey" type="password" placeholder="Paste the key for this test" required>

            <button id="submitButton" type="submit">Predict category</button>
        </form>

        <p id="message" role="status"></p>

        <section id="result" class="result" hidden>
            <h2>Prediction</h2>
            <p><strong>Category:</strong> <span id="category"></span></p>
            <p><strong>Assigned team:</strong> <span id="team"></span></p>
            <p><strong>Urgent:</strong> <span id="urgent"></span></p>
            <p><strong>Confidence:</strong> <span id="confidence"></span></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
