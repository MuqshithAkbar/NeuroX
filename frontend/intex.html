<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><h1>Smart Ticket Classifier</h1></title>
</head>
<body>
    <textarea id="ticket"></textarea>

    <button id="predictBtn">
        Predict Ticket
    </button>

    <div id="result">
        <h2>Prediction Result</h2>

        <p>Category: <span id="category"></span></p>

        <p>Team: <span id="team"></span></p>

        <p>Confidence: <span id="confidence"></span></p>
    </div>
</body>
</html>
